name: personal_asistant
services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${FORWARD_APP_PORT:-8002}:80'
            - '${VITE_PORT:-5175}:5173'
            - '${FORWARD_REVERB_PORT:-8082}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - './docker/8.5/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf'
        networks:
            - sail
            - nginx-red
        depends_on:
            - redis
            - meilisearch
            - mailpit
            - selenium
            - mongo
            - evolution-api
        restart: always

    mongo:
        image: mongo
        restart: always
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-27019}:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: '${DB_USERNAME}'
            MONGO_INITDB_ROOT_PASSWORD: '${DB_PASSWORD}'
            MONGO_INITDB_DATABASE: '${DB_DATABASE}'
        volumes:
            - 'sail-mongo:/data/db'
        networks:
            - sail

    redis:
        image: 'redis:alpine'
        restart: always
        ports:
            - '${FORWARD_REDIS_PORT:-6381}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    meilisearch:
        image: 'getmeili/meilisearch:latest'
        restart: always
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7702}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1027}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8027}:8025'
        networks:
            - sail

    selenium:
        image: selenium/standalone-chromium
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - sail

    evolution-postgres:
        image: postgres:15-alpine
        restart: always
        environment:
            POSTGRES_USER: '${EVOLUTION_DB_USER:-evolution}'
            POSTGRES_PASSWORD: '${EVOLUTION_DB_PASSWORD:-evolution_secret}'
            POSTGRES_DB: '${EVOLUTION_DB_NAME:-evolution}'
        volumes:
            - 'sail-evolution-postgres:/var/lib/postgresql/data'
        networks:
            - sail

    evolution-api:
        image: 'evoapicloud/evolution-api:latest'
        restart: always
        ports:
            - '${EVOLUTION_PORT:-8081}:8080'
        environment:
            - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8081}
            - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change-me-evolution-key}
            - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
            - DATABASE_ENABLED=true
            - DATABASE_PROVIDER=postgresql
            - DATABASE_CONNECTION_URI=postgresql://${EVOLUTION_DB_USER:-evolution}:${EVOLUTION_DB_PASSWORD:-evolution_secret}@evolution-postgres:5432/${EVOLUTION_DB_NAME:-evolution}?schema=public
            - DATABASE_SAVE_DATA_INSTANCE=true
            - DATABASE_SAVE_DATA_NEW_MESSAGE=true
            - DATABASE_SAVE_MESSAGE_UPDATE=true
            - DATABASE_SAVE_DATA_CONTACTS=true
            - DATABASE_SAVE_DATA_CHATS=true
            - CACHE_REDIS_ENABLED=true
            - CACHE_REDIS_URI=redis://redis:6379/2
            - CACHE_REDIS_PREFIX_KEY=evolution
            - WEBHOOK_GLOBAL_ENABLED=false
        volumes:
            - 'sail-evolution-instances:/evolution/instances'
        networks:
            - sail
        depends_on:
            - evolution-postgres
            - redis

networks:
    sail:
        driver: bridge
    nginx-red:
        external: true

volumes:
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
    sail-mongo:
        driver: local
    sail-evolution-postgres:
        driver: local
    sail-evolution-instances:
        driver: local
