name: andres_page
services:
  laravel.test:
    build:
        context: ./docker/8.5
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.5/app'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: 'off'
        IGNITION_LOCAL_SITES_PATH: '/home/papafrita45/servicios/stacks/andres_page'
    volumes:
        - '/home/papafrita45/servicios/stacks/andres_page:/var/www/html' # 👈 AQUÍ LA RUTA ABSOLUTA
    networks:
        - sail
        - nginx-red
    depends_on:
        - redis
        - meilisearch
        - mongo
    restart: always
  mongo:
    image: mongo:7.0
    restart: always
    # Solo localhost del servidor (para Compass vía túnel SSH/Tailscale)
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_DATABASE}
    volumes:
      - sail-mongo:/data/db
    networks:
      - sail
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - sail-redis:/data
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s
  meilisearch:
    image: getmeili/meilisearch:latest
    restart: always
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - sail-meilisearch:/meili_data
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --spider
        - http://127.0.0.1:7700/health
      retries: 3
      timeout: 5s
networks:
  sail:
    driver: bridge
  nginx-red:
    external: true
volumes:
  sail-redis:
    driver: local
  sail-meilisearch:
    driver: local
  sail-mongo:
    driver: local
