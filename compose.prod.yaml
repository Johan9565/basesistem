# Producción (servidor con nginx-red). Uso:
#   docker compose -f compose.prod.yaml up -d
# Sin Redis/Meilisearch: Laravel usa file/sync; Evolution no va en este stack.
name: pa_saber
services:
  laravel.test:
    build:
        context: ./docker/8.5
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.5/app'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: 'off'
        IGNITION_LOCAL_SITES_PATH: '/home/papafrita45/servicios/stacks/pa_saber'
    volumes:
        - '/home/papafrita45/servicios/stacks/pa_saber:/var/www/html'
    networks:
        - sail
        - nginx-red
    depends_on:
        - mongo
    restart: always
  mongo:
    image: mongo:7.0
    restart: always
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_DATABASE}
    volumes:
      - sail-mongo:/data/db
    networks:
      - sail
networks:
  sail:
    driver: bridge
  nginx-red:
    external: true
volumes:
  sail-mongo:
    driver: local
