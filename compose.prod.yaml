# Producción (servidor con nginx-red). Uso:
#   docker compose -f compose.prod.yaml up -d
# Sin Redis/Meilisearch: Laravel usa file/sync; Evolution no va en este stack.
name: gestion_desk
services:
  laravel.test:
    build:
        context: ./docker/8.5
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.5/app'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: 'off'
        IGNITION_LOCAL_SITES_PATH: '${PWD:-/var/www/html}'
    volumes:
        - '.:/var/www/html'
    networks:
        - sail
        - nginx-red
    depends_on:
        - mongo
    restart: always
  mongo:
    image: mongo
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/opt/keyfile/mongo-keyfile"]
    ports:
      - "${FORWARD_DB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_DATABASE}
    volumes:
      - sail-mongo:/data/db
      - ./docker/mongo/mongo-keyfile:/opt/keyfile/mongo-keyfile:ro
    networks:
      - sail
networks:
  sail:
    driver: bridge
  nginx-red:
    external: true
volumes:
  sail-mongo:
    driver: local
